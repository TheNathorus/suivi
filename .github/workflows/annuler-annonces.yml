name: Annuler une mise à jour des annonces

# Remet le suivi (data/etat.json) dans l'état d'avant une mise à jour automatique, bien par bien.
# Sans réponse au champ ci-dessous, annule la dernière mise à jour automatique qui a changé un suivi.
# L'historique reste intact : l'annulation est un nouveau commit, jamais une réécriture.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Numéro du commit à annuler (facultatif, 7 à 40 caractères, visible dans l'historique des commits). Vide = la dernière mise à jour."
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: annonces
  cancel-in-progress: false

jobs:
  annuler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Annuler
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          if [ -n "$COMMIT" ] && ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::Numéro de commit invalide."; exit 1
          fi
          python3 scripts/annuler_annonces.py "$COMMIT"
          if git diff --quiet -- data/etat.json; then
            echo "Rien à annuler."; exit 0
          fi
          git config user.name "Suivi (mise à jour automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etat.json
          git commit -m "Annulation d'une mise à jour automatique du suivi" \
                     -m "Les biens changés par le robot retrouvent leur suivi d'avant. Le robot ne remettra pas le même statut tant que l'annonce ne change pas. Pour corriger un bien ensuite : page /admin/, champ « Suivi »."
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Mise en ligne déjà en cours ou refusée : sans conséquence."
