name: Essai jumelles (temporaire)
on:
  push:
    branches: [claude/jumelles-bienici]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Passage complet sans rien publier
        env:
          MESSAGE_FILE: ${{ runner.temp }}/message.txt
        run: |
          python3 scripts/verifier_annonces.py
          echo "--- jumelles.json"; cat data/jumelles.json
          echo "--- annonces suivies (réf. 20 et 21)"
          python3 - <<'PY'
          import json
          d=json.load(open('data/verification.json'))['biens']
          print({k:d[k] for k in ('20','21','13') if k in d})
          print('--- message'); print(open('${{ runner.temp }}/message.txt').read())
          PY
