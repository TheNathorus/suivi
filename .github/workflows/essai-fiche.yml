name: Lire une fiche (temporaire)
on:
  push:
    branches: [claude/ajout-iad-cabrieres]
permissions:
  contents: write
jobs:
  fiche:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lire la fiche
        run: python3 scripts/lire_fiche.py iad-france-2154030 _fiche
      - name: Enregistrer les photos sur la branche
        run: |
          git config user.name "Suivi (essai)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _fiche
          git commit -m "Photos de la fiche (essai)" || exit 0
          git push origin HEAD:claude/ajout-iad-cabrieres
